# LifeShield base configuration
# This file exists because hardcoded ports/paths/thresholds are banned
# by our own dev rules. Every module reads from here, not from
# constants buried in code.

agent:
  host: "127.0.0.1"
  port: 8787

storage:
  db_path: "./lifeshield.db"

decision_thresholds:
  allow_max: 0.30
  monitor_max: 0.60
  warn_max: 0.80
  strong_warning_max: 0.95
  # anything above strong_warning_max => BLOCK

logging:
  level: "INFO"
  file: "./logs/lifeshield.log"

collectors:
  windows:
    # Seconds between each poll of the Security Event Log and psutil snapshot
    poll_interval_seconds: 5
    # How far back (seconds) to look on the very first login collector poll
    login_lookback_seconds: 30

  filesystem:
    # Directories to watch (defaults to user Downloads and Desktop)
    watch_dirs:
      - "~/Downloads"
      - "~/Desktop"
    # Max file size to compute SHA-256 hash in bytes (default: 50 MB)
    max_hash_bytes: 52428800
    # Polling wait interval between retry attempts when reading locked files (seconds)
    lock_retry_seconds: 0.2

  network:
    # Seconds between network connection snapshot polls
    poll_interval_seconds: 5
    # Seconds between DNS cache inspection polls
    dns_poll_interval_seconds: 5

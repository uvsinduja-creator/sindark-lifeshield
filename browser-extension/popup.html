<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeShield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #1a1d2e;
      border-bottom: 1px solid #2d3148;
    }
    header .logo { font-size: 18px; }
    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #c7d2fe;
    }
    header .version {
      margin-left: auto;
      font-size: 10px;
      color: #6b7280;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #161927;
      border-bottom: 1px solid #2d3148;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.online  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.offline { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .dot.checking{ background: #f59e0b; }
    #status-text { font-size: 12px; color: #94a3b8; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #121522;
      border-bottom: 1px solid #2d3148;
      font-size: 12px;
      color: #cbd5e1;
    }
    .toggle-label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #2d3148;
      border-bottom: 1px solid #2d3148;
    }
    .stat-card {
      background: #0f1117;
      padding: 12px;
      text-align: center;
    }
    .stat-card .value {
      font-size: 20px;
      font-weight: 700;
      color: #818cf8;
    }
    .stat-card .label {
      font-size: 9px;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .last-event {
      padding: 8px 14px;
      font-size: 11px;
      color: #64748b;
      border-bottom: 1px solid #1e2235;
    }
    .last-event span { color: #94a3b8; }

    footer {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer a {
      font-size: 11px;
      color: #6366f1;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
    #refresh-btn {
      background: none;
      border: 1px solid #2d3148;
      color: #94a3b8;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    #refresh-btn:hover { background: #1a1d2e; }
  </style>
</head>
<body>

  <header>
    <span class="logo">🛡️</span>
    <h1>LifeShield</h1>
    <span class="version">v1.0.0</span>
  </header>

  <div class="status-row">
    <div class="dot checking" id="status-dot"></div>
    <span id="status-text">Checking agent...</span>
  </div>

  <div class="toggle-row">
    <label class="toggle-label" for="toggle">
      <input type="checkbox" id="toggle" checked />
      <span>Enable URL collection</span>
    </label>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="value" id="sent-count">—</div>
      <div class="label">Events Sent</div>
    </div>
    <div class="stat-card">
      <div class="value" id="miss-count">—</div>
      <div class="label">Missed (offline)</div>
    </div>
  </div>

  <div class="last-event" id="last-event-row">
    Last event: <span id="last-event-time">—</span>
  </div>

  <footer>
    <a href="http://127.0.0.1:8787/docs" target="_blank">Agent API Docs</a>
    <button id="refresh-btn">↻ Refresh</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
